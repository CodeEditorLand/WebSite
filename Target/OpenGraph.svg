<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
	<!-- Black frame -->
	<rect width="1200" height="675" fill="#151515" />

	<!-- Warm paper card -->
	<rect x="40" y="40" width="1120" height="595" fill="#F5F0E8" />

	<!-- Subtle inner rule -->
	<rect x="52" y="52" width="1096" height="571" fill="none" stroke="#151515" stroke-opacity="0.06" stroke-width="1" />

	<!-- Index / catalogue number -->
	<text x="68" y="100" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="20" font-weight="600" fill="#151515" letter-spacing="0.04em"># LAND_01</text>

	<!-- Stamp -->
	<text x="68" y="136" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="14" font-weight="400" fill="#6b6b6b" letter-spacing="0.02em">〈RUST + TAURI〉 〈NO ELECTRON〉</text>

	<!-- Route -->
	<text x="68" y="164" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#6b6b6b" letter-spacing="0.02em">/COMPAT:VS CODE · EXTENSIONS / UNMODIFIED</text>

	<!-- Title -->
	<text x="68" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#151515">LAND</text>

	<!-- Thin separator -->
	<line x1="68" y1="254" x2="606" y2="254" stroke="#151515" stroke-opacity="0.1" stroke-width="1" />

	<!-- Status / Metadata info lines -->
	<text x="68" y="300" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#6b6b6b" letter-spacing="0.02em">STATUS: SOURCE ACTIVE</text>
	<text x="68" y="330" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#6b6b6b" letter-spacing="0.02em">TARGET: MACOS / WINDOWS / LINUX</text>
	<text x="68" y="360" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#6b6b6b" letter-spacing="0.02em">LICENSE: CC0</text>
	<text x="68" y="390" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#6b6b6b" letter-spacing="0.02em">SIGNAL: LOCAL-FIRST</text>
	<text x="68" y="583" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="400" fill="#6b6b6b" fill-opacity="0.65" letter-spacing="0.04em">NATIVE · OPEN · CROSS-PLATFORM</text>
	<!-- Evidence panel -->
	<rect x="634" y="56" width="498" height="563" fill="#151515" fill-opacity="0.03" />
	<rect x="634" y="56" width="498" height="563" fill="none" stroke="#151515" stroke-opacity="0.08" stroke-width="1" />

	<!-- Evidence image placeholder -->
	<rect x="650" y="68" width="466" height="495" fill="#151515" fill-opacity="0.05" />

	<!-- Cross-hatch placeholder for evidence image -->
	<line x1="650" y1="68" x2="1116" y2="563" stroke="#151515" stroke-opacity="0.06" stroke-width="1" />
	<line x1="1116" y1="68" x2="650" y2="563" stroke="#151515" stroke-opacity="0.06" stroke-width="1" />
	<line x1="883" y1="68" x2="883" y2="563" stroke="#151515" stroke-opacity="0.04" stroke-width="1" />
	<line x1="650" y1="315.5" x2="1116" y2="315.5" stroke="#151515" stroke-opacity="0.04" stroke-width="1" />

	<!-- Green seal -->
	<circle cx="1080" cy="583" r="34" fill="#2D6A4F" />
	<circle cx="1080" cy="583" r="30" fill="none" stroke="#F5F0E8" stroke-width="1.5" />
	<text x="1080" y="588" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="700" fill="#F5F0E8" text-anchor="middle" letter-spacing="0.05em">LAND</text>

	<!-- Footer -->
	<text x="68" y="617" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" fill-opacity="0.45">editor.land</text>
	<text x="1132" y="617" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="10" font-weight="400" fill="#6b6b6b" fill-opacity="0.4" text-anchor="end">field record · product</text>
</svg>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
	<!-- Background -->
	<rect width="1200" height="675" fill="#ffffff" />

	<!-- Top accent line -->
	<rect width="1200" height="4" fill="#151515" fill-opacity="0.12" />

	<!-- Land logo glyph: upper + lower parallelogram, x 690-1160, y 138-538 -->
	<rect width="1005.28" height="620.771" rx="91.3889"
		transform="matrix(-0.23340 0.08959 0 0.25 925 138)"
		fill="#151515" fill-opacity="0.20" />
	<rect width="1005.28" height="620.771" rx="91.3889"
		transform="matrix(-0.23340 0.08959 0 0.25 1160 292.55)"
		fill="#151515" fill-opacity="0.20" />

	<!-- Section badge -->
	<rect x="72" y="56" width="145" height="32" rx="4" fill="#151515" fill-opacity="0.08" />
		<text x="86" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#555555" letter-spacing="0.1em">DASHBOARD</text>

	<!-- Title -->
	<text x="72" y="138" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#151515">Dashboard | Code</text>
		<text x="72" y="200.4" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#151515">Editor Land</text>

	<!-- Description -->
	<text x="72" y="282.8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#666666">Your Code Editor Land dashboard. Manage your</text>
		<text x="72" y="314.8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#666666">account and settings.</text>

	<!-- Bottom bar -->
	<rect y="619" width="1200" height="56" fill="#fafafa" />
	<line x1="0" y1="619" x2="1200" y2="619" stroke="#e5e5e5" stroke-width="1" />

	<!-- URL (bottom-left) -->
	<text x="72" y="655" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#888888">editor.land</text>

	<!-- Brand name (bottom-right) -->
	<text x="1128" y="655" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#888888" text-anchor="end">Code Editor Land</text>
</svg>